<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parcel Takeoff</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="top">
        <div>
            <p class="eyebrow">Site quantities</p>
            <h1>Parcel Takeoff</h1>
        </div>
        <p id="status" role="status">Add a property, then the parts you want measured.</p>
    </header>
    <main class="layout">
        <section class="panel" aria-label="Property">
            <h2>Property</h2>
            <form id="property-form">
                <label for="property-name">Name</label>
                <input id="property-name" name="name" autocomplete="off" required>
                <label for="property-address">Address</label>
                <input id="property-address" name="address" autocomplete="off">
                <div class="row">
                    <button type="submit">Add property</button>
                    <button type="button" id="save-property">Save</button>
                    <button type="button" id="delete-property">Delete</button>
                </div>
            </form>
            <ul id="properties" class="list"></ul>
            <h2>Component</h2>
            <form id="component-form">
                <label for="component-name">Name</label>
                <input id="component-name" name="name" autocomplete="off" required>
                <label for="component-kind">Measure</label>
                <select id="component-kind" name="kind">
                    <option value="area">Area</option>
                    <option value="length">Length</option>
                    <option value="count">Count</option>
                </select>
                <label for="component-unit">Unit</label>
                <input id="component-unit" name="unit" value="sq ft" autocomplete="off" required>
                <label for="component-swatch">Swatch</label>
                <input id="component-swatch" name="swatch" type="color" value="#8d6a4a">
                <div class="row">
                    <button type="submit">Add component</button>
                    <button type="button" id="save-component">Save</button>
                    <button type="button" id="delete-component">Delete</button>
                </div>
            </form>
            <ul id="components" class="list"></ul>
        </section>
        <section class="stage" aria-label="Site image">
            <div class="toolbar">
                <button type="button" class="tool" data-tool="area" aria-pressed="true">Area</button>
                <button type="button" class="tool" data-tool="length" aria-pressed="false">Length</button>
                <button type="button" class="tool" data-tool="count" aria-pressed="false">Count</button>
                <button type="button" class="tool" data-tool="scale" aria-pressed="false">Scale</button>
                <button type="button" class="tool" data-tool="swatch" aria-pressed="false">Swatch</button>
                <label class="file" for="image-file">Image
                    <input id="image-file" type="file" accept="image/*">
                </label>
                <button type="button" id="load-sample">Load sample lot</button>
            </div>
            <div class="scale-bar">
                <label for="known-length">Known length</label>
                <input id="known-length" type="number" min="0" step="any" placeholder="40">
                <label for="scale-unit">Unit</label>
                <input id="scale-unit" value="ft" autocomplete="off">
                <p id="scale-readout">Scale not set</p>
            </div>
            <p class="hint">Click to mark. Enter finishes a shape or a run. Backspace drops the last point. Escape cancels.</p>
            <canvas id="surface" width="640" height="400" aria-label="Site image measurement surface"></canvas>
        </section>
        <section class="panel" aria-label="Quantities">
            <div class="row spread">
                <h2>Schedule</h2>
                <button type="button" id="export-csv">Export CSV</button>
                <button type="button" id="measure-swatches">Measure swatches</button>
            </div>
            <label class="inline" for="tolerance">Color tolerance
                <input id="tolerance" type="number" min="0" step="1" value="12">
            </label>
            <table>
                <thead>
                    <tr>
                        <th>Component</th>
                        <th>Quantity</th>
                        <th>Unit</th>
                        <th>Marks</th>
                    </tr>
                </thead>
                <tbody id="schedule"></tbody>
            </table>
        </section>
    </main>
    <script type="module" src="main.js"></script>
</body>
</html>
